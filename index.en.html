<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2f5d50" />
    <link rel="manifest" href="/manifest.en.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- SEO -->
    <title>Secret Santa Generator: Free Online Gift Exchange for Friends, Family &amp; Work</title>
    <meta
      name="description"
      content="Set up your Secret Santa in 2 minutes: secret name draw, wishlists, anonymous messages, photos and reminders. Free and ad-free, for friends, family, the office or school."
    />
    <meta
      name="keywords"
      content="secret santa, secret santa generator, gift exchange, name draw, white elephant, anonymous gift, office gift exchange, family gift exchange"
    />
    <meta name="author" content="Secret Santa" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://amisecret.xyz/en" />
    <link rel="alternate" hreflang="fr" href="https://amisecret.xyz/" />
    <link rel="alternate" hreflang="en" href="https://amisecret.xyz/en" />
    <link rel="alternate" hreflang="x-default" href="https://amisecret.xyz/" />

    <!-- Open Graph (Facebook, Messenger, LinkedIn…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Secret Santa" />
    <meta property="og:url" content="https://amisecret.xyz/en" />
    <meta property="og:title" content="Secret Santa: your gift exchange, minus the hassle" />
    <meta
      property="og:description"
      content="Secret draw, wishlists, anonymous messages, photos and reminders: everything you need for a gift exchange to remember. Free and ad-free."
    />
    <meta property="og:image" content="https://amisecret.xyz/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Secret Santa: the anonymous gift exchange app" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="fr_CA" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Secret Santa: your gift exchange, minus the hassle" />
    <meta
      name="twitter:description"
      content="Secret draw, wishlists, anonymous messages, photos and reminders: everything you need for a gift exchange to remember. Free and ad-free."
    />
    <meta name="twitter:image" content="https://amisecret.xyz/og-image.png" />

    <!-- Structured data for search engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Secret Santa",
        "url": "https://amisecret.xyz/en",
        "description": "Run your Secret Santa gift exchange: secret name draw, wishlists, anonymous messages, photos and reminders. For friends, family, the office or school.",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "Web, iOS, Android",
        "inLanguage": "en",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "CAD" }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=Caveat:wght@500;600;700&family=Nunito+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
